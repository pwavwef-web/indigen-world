[extend]
useDefault = true

[allowlist]
description = "Public Firebase client configuration"
paths = [
  '''apps/mobile/lib/firebase_options_(development|staging|production)\.dart''',
  '''apps/(website|tribestudio)/src/firebase\.ts'''
]

# An AdMob application or ad-unit id is not a credential, but every one of them
# embeds the account's publisher id, and a unit id in a public repository is a
# unit somebody else's app can request. They belong in CI secrets or in the
# ignored apps/mobile/admob.release.json, never in tracked content — so a paste
# into a source file, a test fixture, a workflow or a release note fails the
# build rather than being noticed later.
[[rules]]
id = "admob-identifier"
description = "AdMob application or ad-unit id (embeds the account publisher id)"
regex = '''ca-app-pub-\d{16}[~/]\d{10}'''
tags = ["admob", "publisher-id"]

  [rules.allowlist]
  description = "Google's published sample ids, and the all-zero example placeholders"
  regexes = [
    '''ca-app-pub-3940256099942544[~/]\d{10}''',
    '''ca-app-pub-0{16}[~/]\d{10}''',
  ]

# The authorised-seller record the website publishes at /app-ads.txt contains
# the same publisher id in Google's other spelling.
[[rules]]
id = "admob-app-ads-record"
description = "AdMob app-ads.txt authorised-seller record"
regex = '''google\.com,\s*pub-\d{16},\s*DIRECT'''
tags = ["admob", "publisher-id"]

  [rules.allowlist]
  description = "The documented shape, with no real publisher id in it"
  regexes = ['''google\.com,\s*pub-0{16},\s*DIRECT''']
