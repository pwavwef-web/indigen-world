<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .phone { --w: 410px; }
  .stage { gap: 64px; }
</style>
<div class="stage">
  <div class="column">
    <div class="phone"><img src="../screens/music-bar-light.png" alt=""></div>
    <span class="pill"><span class="dot"></span>The player bar</span>
  </div>
  <div class="arrow">&rarr;</div>
  <div class="column">
    <div class="phone"><img src="../screens/music-bubble-light.png" alt=""></div>
    <span class="pill"><span class="dot"></span>Minimised to a bubble</span>
  </div>
</div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
