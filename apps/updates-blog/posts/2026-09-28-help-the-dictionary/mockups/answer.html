<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .phone { --w: 390px; }
  .stage { gap: 60px; }
  .pill { font-size: 23px; }
</style>
<div class="stage">
  <div class="column">
    <div class="phone"><img src="../screens/answer-guest.png" alt=""></div>
    <span class="pill amber"><span class="dot"></span>Write it before signing in</span>
  </div>
  <div class="column">
    <div class="phone"><img src="../screens/answer-guest-lower.png" alt=""></div>
    <span class="pill"><span class="dot"></span>Your choices, then Sign in to send</span>
  </div>
  <div class="column">
    <div class="phone"><img src="../screens/answer-sent.png" alt=""></div>
    <span class="pill green"><span class="dot"></span>Submitted for review</span>
  </div>
</div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
