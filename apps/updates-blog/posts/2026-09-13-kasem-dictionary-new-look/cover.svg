<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The Kasem Dictionary has a new look: a reviewed entry card over the indigenworld.com blue">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1225"/>
      <stop offset="0.62" stop-color="#19327f"/>
      <stop offset="1" stop-color="#2457d6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.8" cy="0.18" r="0.42">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#040a19" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g fill="none" stroke="#8eb4ff" stroke-opacity="0.13">
    <circle cx="1150" cy="40" r="120"/>
    <circle cx="1150" cy="40" r="190"/>
    <circle cx="1150" cy="40" r="260"/>
  </g>

  <!-- Brand row -->
  <g transform="translate(72 64)">
    <g transform="scale(0.72)">
      <path d="M15 47V23l17-9 17 9v24" fill="none" stroke="#8eb4ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 44V29m8 15V24m8 20V29" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="14" r="4.4" fill="#22d3ee"/>
    </g>
    <text x="58" y="31" fill="#ffffff" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="800">Indigen World Updates</text>
  </g>

  <!-- Release pill -->
  <g transform="translate(72 168)">
    <rect width="134" height="36" rx="18" fill="#2f6bff" fill-opacity="0.16" stroke="#8eb4ff" stroke-opacity="0.3"/>
    <circle cx="22" cy="18" r="4.5" fill="#22d3ee"/>
    <circle cx="22" cy="18" r="9" fill="#22d3ee" fill-opacity="0.14"/>
    <text x="40" y="24" fill="#ffffff" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">RELEASE</text>
  </g>

  <!-- Headline -->
  <g font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="800">
    <text x="70" y="286" fill="#ffffff" font-size="62" letter-spacing="-0.6">The Kasem</text>
    <text x="70" y="358" fill="#ffffff" font-size="62" letter-spacing="-0.6">Dictionary has</text>
    <text x="70" y="430" fill="#bcd2ff" font-size="62" letter-spacing="-0.6">a new look.</text>
  </g>
  <text x="72" y="486" fill="#ffffff" fill-opacity="0.78" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="500">In step with indigenworld.com, on every screen.</text>
  <text x="72" y="562" fill="#8eb4ff" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="0.4">www.venacula.com</text>

  <!-- Search bar mock -->
  <g transform="translate(664 104)">
    <rect width="464" height="58" rx="18" fill="url(#glass)" stroke="#8eb4ff" stroke-opacity="0.34"/>
    <circle cx="33" cy="27" r="8" fill="none" stroke="#8eb4ff" stroke-width="2.4"/>
    <path d="M39 33l7 7" stroke="#8eb4ff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="36" fill="#ffffff" fill-opacity="0.72" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="500">Search Kasem or English</text>
  </g>

  <!-- Entry card mock -->
  <g transform="translate(664 188)" filter="url(#lift)">
    <rect width="464" height="352" rx="26" fill="#ffffff"/>
    <g font-family="'Noto Sans', 'Segoe UI', sans-serif">
      <rect x="34" y="32" width="156" height="32" rx="16" fill="#2f6bff" fill-opacity="0.09" stroke="#2f6bff" stroke-opacity="0.2"/>
      <text x="52" y="53" fill="#1f50d6" font-size="13" font-weight="800" letter-spacing="1">REVIEWED ENTRY</text>
      <rect x="352" y="30" width="78" height="36" rx="18" fill="#ffffff" stroke="#0f1830" stroke-opacity="0.12"/>
      <text x="370" y="54" fill="#2f6bff" font-size="17" font-weight="800">&#9734;</text>
      <text x="390" y="53" fill="#19327f" font-size="14" font-weight="800">Save</text>

      <text x="34" y="108" fill="#1f50d6" font-size="13" font-weight="700" letter-spacing="1.8">SENTENCE</text>
      <text x="32" y="162" fill="#19327f" font-size="50" font-weight="800" letter-spacing="-0.8">&#193; maa ve yaga.</text>
      <text x="34" y="200" fill="#1f50d6" font-size="19" font-weight="700">You (plural) are going to the market.</text>

      <rect x="34" y="232" width="396" height="86" rx="14" fill="#f8faff" stroke="#0f1830" stroke-opacity="0.1"/>
      <rect x="34" y="232" width="4" height="86" rx="2" fill="#2f6bff"/>
      <text x="56" y="262" fill="#19327f" font-size="12" font-weight="800" letter-spacing="1.4">EXAMPLE</text>
      <text x="56" y="287" fill="#0f1830" font-size="16">&#193; maa ve yaga.</text>
      <text x="56" y="308" fill="#5d667b" font-size="15">You (plural) are going to the market.</text>
    </g>
  </g>
</svg>
