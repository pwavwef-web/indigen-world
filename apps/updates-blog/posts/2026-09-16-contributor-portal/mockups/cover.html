<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .copy { position: absolute; left: 64px; top: 70px; width: 440px; }
  .eyebrow { font-size: 16px; letter-spacing: 2.6px; }
  h1 { margin-top: 18px; font-size: 50px; line-height: 1.05; font-weight: 800; letter-spacing: -1.2px; }
  p { margin-top: 20px; font-size: 20px; line-height: 1.45; color: rgba(255,255,255,0.82); }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .pill { font-size: 16px; padding: 8px 15px; gap: 9px; }
  .pill .dot { width: 10px; height: 10px; }
  .browser { --bw: 660px; --bh: 420px; position: absolute; left: 540px; top: 80px; transform: rotate(-2deg); }
  .phone { --w: 210px; position: absolute; right: 36px; top: 150px; transform: rotate(5deg); z-index: 2; }
</style>
<div class="copy">
  <div class="eyebrow">TribeStudio &middot; Contributors</div>
  <h1>A workspace for Kasem expressions</h1>
  <p>Assigned expressions, drafts that save themselves, and reviewer feedback in one place.</p>
  <div class="tags">
    <span class="pill"><span class="dot"></span>Autosaved drafts</span>
    <span class="pill amber"><span class="dot"></span>Reviewer feedback</span>
    <span class="pill green"><span class="dot"></span>Invitation only</span>
  </div>
</div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span>tribestudio.indigenworld.com/contributor</span></div><img src="../screens/desktop-workspace.png" alt=""></div>
<div class="phone"><img src="../screens/phone-list.png" alt=""></div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
