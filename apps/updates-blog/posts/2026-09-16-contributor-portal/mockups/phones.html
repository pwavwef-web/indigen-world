<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>.phone { --w: 410px; } .stage { gap: 120px; }</style>
<div class="stage">
  <div class="column">
    <div class="phone"><img src="../screens/phone-list.png" alt=""></div>
    <span class="pill"><span class="dot"></span>Your expressions</span>
  </div>
  <div class="column">
    <div class="phone"><img src="../screens/phone-editor.png" alt=""></div>
    <span class="pill green"><span class="dot"></span>Write it in Kasem</span>
  </div>
</div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
