<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7f5ef"/>
  <text x="90" y="92" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#526b61">INDIGEN WORLD · CONTRIBUTOR UPDATE</text>
  <text x="90" y="166" font-family="Segoe UI, sans-serif" font-size="49" font-weight="700" fill="#233d34">Words to look up. Expressions to learn from.</text>
  <text x="90" y="215" font-family="Segoe UI, sans-serif" font-size="23" fill="#526b61">A clearer home for language contributions</text>
  <rect x="90" y="280" width="570" height="352" rx="26" fill="#e6ede4"/>
  <rect x="740" y="280" width="570" height="352" rx="26" fill="#e7eaf5"/>
  <text x="128" y="339" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#42634f">DICTIONARY</text>
  <text x="128" y="397" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#233d34">Words and their meanings</text>
  <text x="128" y="459" font-family="Segoe UI, sans-serif" font-size="24" fill="#233d34">Word entries stay searchable.</text>
  <text x="128" y="505" font-family="Segoe UI, sans-serif" font-size="24" fill="#233d34">Usage sentences can illustrate a word.</text>
  <text x="128" y="551" font-family="Segoe UI, sans-serif" font-size="24" fill="#233d34">Expressions have a separate home.</text>
  <text x="778" y="339" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#455797">TRAINING SOURCE DATA</text>
  <text x="778" y="397" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#29365e">Whole expressions</text>
  <text x="778" y="459" font-family="Segoe UI, sans-serif" font-size="24" fill="#29365e">Meaning, alternatives and usage notes.</text>
  <text x="778" y="505" font-family="Segoe UI, sans-serif" font-size="24" fill="#29365e">Review and quality checks still apply.</text>
  <text x="778" y="551" font-family="Segoe UI, sans-serif" font-size="24" fill="#29365e">Source records and permission retained.</text>
  <rect x="90" y="682" width="1220" height="66" rx="15" fill="#233d34"/>
  <text x="122" y="724" font-family="Segoe UI, sans-serif" font-size="23" fill="#fff">Portal participation requires agreement to training use for all future submissions.</text>
  <text x="90" y="788" font-family="Segoe UI, sans-serif" font-size="17" fill="#526b61">Conceptual illustration of the revised workflow · Prepared October 2, 2026 · Deployment pending</text>
</svg>
