<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .stage { justify-content: flex-start; padding: 0 0 0 72px; gap: 0; }
  .copy { width: 560px; }
  .eyebrow { font-size: 17px; letter-spacing: 2.6px; }
  h1 { margin-top: 18px; font-size: 52px; line-height: 1.02; font-weight: 800; letter-spacing: -1.3px; }
  p { margin-top: 20px; font-size: 20px; line-height: 1.45; color: rgba(255,255,255,0.82); }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .pill { font-size: 17px; padding: 9px 16px; gap: 9px; }
  .pill .dot { width: 10px; height: 10px; }
  .phones { position: absolute; right: 30px; top: 0; width: 560px; height: 630px; }
  .phones .phone { position: absolute; }
  .a { --w: 250px; left: 20px; top: 70px; transform: rotate(-6deg); }
  .b { --w: 262px; right: 20px; top: 40px; transform: rotate(5deg); z-index: 2; }
</style>
<div class="stage">
  <div class="copy">
    <div class="eyebrow">Indigen World · 0.1.28</div>
    <h1>Explore keeps your place. My Space gets simpler.</h1>
    <p>Come back to the reel you left, swipe back without waiting, and double-tap what you love. Your profile, your library and your work now sit on one page.</p>
    <div class="tags">
      <span class="pill"><span class="dot"></span>Back to your reel</span>
      <span class="pill amber"><span class="dot"></span>Double-tap to appreciate</span>
      <span class="pill green"><span class="dot"></span>You · Membership · Settings</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone a"><img src="../screens/you-dark.png" alt=""></div>
    <div class="phone b"><img src="../screens/explore-heart.png" alt=""></div>
  </div>
</div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
