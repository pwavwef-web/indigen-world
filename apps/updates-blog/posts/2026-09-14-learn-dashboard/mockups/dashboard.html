<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .phone { --w: 560px; }
  .stage { gap: 70px; }
  .column { align-items: flex-start; gap: 22px; }
  .pill { font-size: 25px; }
</style>
<div class="stage">
  <div class="phone"><img src="../screens/dashboard.png" alt=""></div>
  <div class="column">
    <div class="eyebrow">The new Learn tab</div>
    <span class="pill"><span class="dot"></span>Your streak, XP and goal</span>
    <span class="pill green"><span class="dot"></span>Today's lesson, resumed</span>
    <span class="pill"><span class="dot"></span>Review · Listen · Speak</span>
    <span class="pill amber"><span class="dot"></span>Word of the day</span>
    <span class="pill green"><span class="dot"></span>A tick for every day</span>
  </div>
</div>
<script>Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.__ready = true; });</script>
