<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101c36" />
    <title>Offline — TribeStudio</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fffdf8; color: #172033; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(88vw, 420px); text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.6rem; margin: 24px 0 8px; }
      p { color: #4c5568; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #101c36; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #b65a3a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>TribeStudio is offline</h1>
      <p>Reconnect to open your workspace, upload files, or publish. If you were writing in an open tab, keep it open: your draft can save when your connection returns.</p>
      <a href="/studio">Try again</a>
    </main>
  </body>
</html>
